[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigilghr"
version = "0.1.0"
description = "Real-time hand gesture recognition macro engine implementing Habib et al. (2025)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gesture-recognition", "computer-vision", "mediapipe", "macro", "hand-tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.5.0",
    "opencv-python>=4.5.0",
    "mediapipe>=0.8.7",
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
]

[project.optional-dependencies]
torch = [
    "torch>=1.8.0",
    "torchvision>=0.9.0",
]
dev = [
    "pytest>=6.0.0",
]

[project.scripts]
sigil = "sigil.main:cli"

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/SigilGHR"

[tool.setuptools.packages.find]
where = ["."]
include = ["sigil*"]
